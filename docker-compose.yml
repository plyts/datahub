# =============================================================================
# Data Hub — On-premise Data Orchestration, Transformation & Observability
# Single VM (Linux SLES / VirtualBox), Docker Compose, 100 % Open Source.
#
#   make up ENV=dev          (see Makefile; secrets in .env, settings in envs/<env>.env)
#
# Only Caddy publishes ports on the host. Every other service is reachable
# exclusively on the internal Docker network.
# =============================================================================
name: datahub

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &restart
  restart: unless-stopped

x-dagster-env: &dagster-env
  DAGSTER_PG_HOST: postgres
  DAGSTER_PG_DB: dagster
  DAGSTER_PG_USER: dagster
  DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:?}
  DAGSTER_CODE_HOST: dagster-code
  DATAHUB_ENV: ${DATAHUB_ENV:-dev}
  DATAHUB_TIMEZONE: ${DATAHUB_TIMEZONE:-Europe/Paris}
  DATAHUB_PARTITIONS_START: ${DATAHUB_PARTITIONS_START:-2026-01-01}
  DATAHUB_PUBLIC_URL: ${DATAHUB_PUBLIC_URL:?}
  DBT_TARGET: ${DATAHUB_ENV:-dev}
  DBT_THREADS: ${DBT_THREADS:-4}
  DUCKDB_PATH: /data/duckdb/datahub_${DATAHUB_ENV:-dev}.duckdb
  DBT_ARTIFACTS_DIR: /data/dbt_artifacts
  DATAHUB_LANDING_DIR: /data/landing
  DATAHUB_APP_DB_RO_URL: postgresql://datahub_ro:${DATAHUB_RO_PASSWORD:?}@postgres:5432/datahub
  NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-25}
  SMTP_FROM: ${SMTP_FROM:-datahub@localhost}
  NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}

x-dagster-volumes: &dagster-volumes
  - duckdb_data:/data/duckdb
  - dbt_artifacts:/data/dbt_artifacts
  - landing:/data/landing
  - dagster_storage:/opt/dagster/storage

x-ui-env: &ui-env
  DATAHUB_ENV: ${DATAHUB_ENV:-dev}
  DATAHUB_VERSION: ${DATAHUB_VERSION:-1.0.0}
  DATAHUB_PUBLIC_URL: ${DATAHUB_PUBLIC_URL:?}
  DATAHUB_AUTH_MODE: ${DATAHUB_AUTH_MODE:-oidc}
  DATAHUB_TIMEZONE: ${DATAHUB_TIMEZONE:-Europe/Paris}
  DAGSTER_GRAPHQL_URL: http://dagster-webserver:3000/dagster/graphql
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-datahub}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
  OIDC_CLIENT_ID: datahub-ui
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
  STREAMLIT_COOKIE_SECRET: ${STREAMLIT_COOKIE_SECRET:?}
  DATAHUB_APP_DB_URL: postgresql://datahub_app:${DATAHUB_APP_DB_PASSWORD:?}@postgres:5432/datahub
  LOKI_URL: http://loki:3100
  PROMETHEUS_URL: http://prometheus:9090
  GRAFANA_INTERNAL_URL: http://grafana:3000/grafana
  DBT_ARTIFACTS_DIR: /data/dbt_artifacts
  DUCKDB_PATH: /data/duckdb/datahub_${DATAHUB_ENV:-dev}.duckdb
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318

services:
  # ------------------------------------------------------------------ storage
  postgres:
    image: postgres:17-bookworm
    <<: *restart
    logging: *logging
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      DATAHUB_APP_DB_PASSWORD: ${DATAHUB_APP_DB_PASSWORD:?}
      DATAHUB_RO_PASSWORD: ${DATAHUB_RO_PASSWORD:?}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    <<: *restart
    logging: *logging
    mem_limit: 1g
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${DATAHUB_PUBLIC_URL:?}/auth
      # Browsers use the public URL; containers call http://keycloak:8080 (token, keys, userinfo),
      # so HTTPS with an internal CA in production needs no CA inside the containers.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
      # Placeholders substituted in the imported realm (services/keycloak/realm/datahub-realm.json)
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-datahub}
      DATAHUB_PUBLIC_URL: ${DATAHUB_PUBLIC_URL:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      DAGSTER_PROXY_CLIENT_SECRET: ${DAGSTER_PROXY_CLIENT_SECRET:?}
      GRAFANA_OIDC_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
      DATAHUB_ADMIN_USERNAME: ${DATAHUB_ADMIN_USERNAME:-datahub-admin}
      DATAHUB_ADMIN_EMAIL: ${DATAHUB_ADMIN_EMAIL:-admin@datahub.local}
      DATAHUB_ADMIN_PASSWORD: ${DATAHUB_ADMIN_PASSWORD:?}
    volumes:
      - ./services/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image has no curl: plain HTTP over bash /dev/tcp on the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ------------------------------------------------------------ orchestration
  dagster-code:
    build:
      context: ./services/dagster
      args:
        GIT_SHA: ${DATAHUB_GIT_SHA:-unknown}
    image: datahub/dagster:${DATAHUB_VERSION:-1.0.0}
    <<: *restart
    logging: *logging
    mem_limit: 3g
    environment: *dagster-env
    volumes: *dagster-volumes
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  dagster-webserver:
    image: datahub/dagster:${DATAHUB_VERSION:-1.0.0}
    pull_policy: never  # image built locally by the service that has `build:`
    <<: *restart
    logging: *logging
    mem_limit: 1g
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml", "--path-prefix", "/dagster"]
    environment: *dagster-env
    volumes: *dagster-volumes
    depends_on:
      dagster-code:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/dagster/server_info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  dagster-daemon:
    image: datahub/dagster:${DATAHUB_VERSION:-1.0.0}
    pull_policy: never  # image built locally by the service that has `build:`
    <<: *restart
    logging: *logging
    mem_limit: 768m
    command: ["dagster-daemon", "run", "-w", "workspace.yaml"]
    environment: *dagster-env
    volumes: *dagster-volumes
    depends_on:
      dagster-code:
        condition: service_healthy

  # --------------------------------------------------------------------- UI
  datahub-ui:
    build:
      context: ./services/datahub-ui
      args:
        GIT_SHA: ${DATAHUB_GIT_SHA:-unknown}
        VERSION: ${DATAHUB_VERSION:-1.0.0}
    image: datahub/ui:${DATAHUB_VERSION:-1.0.0}
    <<: *restart
    logging: *logging
    mem_limit: 768m
    environment:
      <<: *ui-env
      OTEL_SERVICE_NAME: datahub-ui
    volumes:
      - dbt_artifacts:/data/dbt_artifacts:ro
      - duckdb_data:/data/duckdb:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      dagster-webserver:
        condition: service_healthy

  datahub-exporter:
    image: datahub/ui:${DATAHUB_VERSION:-1.0.0}
    pull_policy: never  # image built locally by the service that has `build:`
    <<: *restart
    logging: *logging
    mem_limit: 256m
    entrypoint: ["/usr/bin/tini", "--", "python", "-m", "datahub_ui.exporter"]
    environment:
      DAGSTER_GRAPHQL_URL: http://dagster-webserver:3000/dagster/graphql
      EXPORTER_PORT: "9188"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: datahub-exporter
      DATAHUB_ENV: ${DATAHUB_ENV:-dev}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9188/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      dagster-webserver:
        condition: service_healthy

  # -------------------------------------------------------------- entry point
  caddy:
    image: caddy:2.11.9
    <<: *restart
    logging: *logging
    mem_limit: 256m
    ports:
      - "${DATAHUB_HTTP_PORT:-80}:80"
      - "${DATAHUB_HTTPS_PORT:-443}:443"
    environment:
      DATAHUB_SITE_ADDRESS: ${DATAHUB_SITE_ADDRESS:-${DATAHUB_PUBLIC_URL}}
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dbt_artifacts:/srv/dbt-docs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # Containers resolve the public host name to Caddy, so OIDC URLs are identical
        # inside the stack and in the users' browsers.
        aliases:
          - ${DATAHUB_HOST:?}

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    <<: *restart
    logging: *logging
    mem_limit: 128m
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: dagster-proxy
      OAUTH2_PROXY_CLIENT_SECRET: ${DAGSTER_PROXY_CLIENT_SECRET:?}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${DATAHUB_PUBLIC_URL:?}/auth/realms/${KEYCLOAK_REALM:-datahub}
      # Login page through the public URL (browser); token, keys and userinfo on the internal network.
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: ${DATAHUB_PUBLIC_URL:?}/auth/realms/${KEYCLOAK_REALM:-datahub}/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:-datahub}/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:-datahub}/protocol/openid-connect/certs
      OAUTH2_PROXY_VALIDATE_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:-datahub}/protocol/openid-connect/userinfo
      OAUTH2_PROXY_REDIRECT_URL: ${DATAHUB_PUBLIC_URL:?}/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?}
      OAUTH2_PROXY_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OAUTH2_PROXY_COOKIE_NAME: _datahub_oauth2
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_COOKIE_REFRESH: 4m
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Native Dagster UI / GraphQL and dbt docs: data engineers and admins only.
      OAUTH2_PROXY_ALLOWED_ROLES: ADMIN,DATA_ENGINEER
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_METRICS_ADDRESS: 0.0.0.0:44180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${DATAHUB_HOST:?}
      OAUTH2_PROXY_SCOPE: openid profile email
    depends_on:
      keycloak:
        condition: service_healthy

  # ------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:v3.16.0
    <<: *restart
    logging: *logging
    mem_limit: 1g
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.3.1
    <<: *restart
    logging: *logging
    mem_limit: 512m
    environment:
      GF_SERVER_ROOT_URL: ${DATAHUB_PUBLIC_URL:?}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SECURITY_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # SSO with Keycloak; Grafana role derived from the Data Hub roles (no role = no access).
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${DATAHUB_PUBLIC_URL:?}/auth/realms/${KEYCLOAK_REALM:-datahub}/protocol/openid-connect/auth
      # Token and userinfo are server-side calls: internal URL (no TLS trust needed in production).
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:-datahub}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:-datahub}/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
        contains(roles[*], 'ADMIN') && 'Admin' || contains(roles[*], 'DATA_ENGINEER') && 'Editor' ||
        (contains(roles[*], 'ANALYST') || contains(roles[*], 'VIEWER')) && 'Viewer'
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${DATAHUB_PUBLIC_URL:?}/auth/realms/${KEYCLOAK_REALM:-datahub}/protocol/openid-connect/logout
      DATAHUB_RO_PASSWORD: ${DATAHUB_RO_PASSWORD:?}
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/grafana/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Routes the Prometheus alerts (services/prometheus/rules) to the webhook / e-mail of .env.
  alertmanager:
    image: prom/alertmanager:v0.33.1
    <<: *restart
    logging: *logging
    mem_limit: 128m
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-config.sh", "/tmp/alertmanager"]
    command: ["--config.file=/tmp/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    environment:
      DATAHUB_ENV: ${DATAHUB_ENV:-dev}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-datahub@localhost}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
    volumes:
      - ./services/alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.7.10
    <<: *restart
    logging: *logging
    mem_limit: 1g
    command: ["-config.file=/etc/loki/loki-config.yml", "-config.expand-env=true"]
    volumes:
      - ./services/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.22.0
    <<: *restart
    logging: *logging
    mem_limit: 512m
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
      PROMETHEUS_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
    volumes:
      - ./services/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    # SELinux hosts (SLES 16, openSUSE Leap 16): reading the Docker socket needs an unconfined
    # label. No effect where SELinux is off (Ubuntu, Docker Desktop).
    security_opt: ["label=disable"]

  node-exporter:
    image: prom/node-exporter:v1.12.0
    <<: *restart
    logging: *logging
    mem_limit: 128m
    pid: host
    command: ["--path.rootfs=/host"]
    security_opt: ["label=disable"]   # host filesystem stats on SELinux hosts
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    <<: *restart
    logging: *logging
    mem_limit: 256m
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=30s", "--store_container_labels=false"]
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1
    <<: *restart
    logging: *logging
    mem_limit: 128m
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  duckdb_data:
  dbt_artifacts:
  landing:
  dagster_storage:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  alertmanager_data:
