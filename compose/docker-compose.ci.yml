# CI override (GitHub Actions / Woodpecker): faster schedules are not needed, but the
# webserver is exposed on localhost so integration tests can call the GraphQL API directly.
services:
  dagster-webserver:
    ports: ["127.0.0.1:3000:3000"]
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  prometheus:
    ports: ["127.0.0.1:9090:9090"]
  loki:
    ports: ["127.0.0.1:3100:3100"]
