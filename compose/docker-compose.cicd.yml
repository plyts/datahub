# Optional self-hosted Git + CI/CD (profile "cicd"): Gitea + Woodpecker CI.
#   docker compose -f docker-compose.yml -f compose/docker-compose.cicd.yml --profile cicd up -d
# One-time setup (docs/cicd.md): create an OAuth2 application in Gitea and set
# WOODPECKER_GITEA_CLIENT / WOODPECKER_GITEA_SECRET / WOODPECKER_AGENT_SECRET in .env.
services:
  gitea:
    image: gitea/gitea:1.27.3
    profiles: ["cicd"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: ${DATAHUB_PUBLIC_URL:?}:3001/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: woodpecker-server
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.20.1
    profiles: ["cicd"]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      WOODPECKER_HOST: ${DATAHUB_PUBLIC_URL:?}:8000
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: ${DATAHUB_PUBLIC_URL:?}:3001
      WOODPECKER_GITEA_CLIENT: ${WOODPECKER_GITEA_CLIENT:-}
      WOODPECKER_GITEA_SECRET: ${WOODPECKER_GITEA_SECRET:-}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-}
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN:-datahub-admin}
      WOODPECKER_OPEN: "false"
    ports:
      - "8000:8000"
    volumes:
      - woodpecker_data:/var/lib/woodpecker

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.20.1
    profiles: ["cicd"]
    restart: unless-stopped
    mem_limit: 512m
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-}
      WOODPECKER_MAX_WORKFLOWS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - woodpecker-server

volumes:
  gitea_data:
  woodpecker_data:
