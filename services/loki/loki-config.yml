# Grafana Loki — single binary, filesystem storage, 30 days retention.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LOKI_DATA_DIR:-/loki}
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA_DIR:-/loki}/chunks
      rules_directory: ${LOKI_DATA_DIR:-/loki}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h
  allow_structured_metadata: true
  volume_enabled: true
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: ${LOKI_DATA_DIR:-/loki}/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: ${LOKI_DATA_DIR:-/loki}/rules

analytics:
  reporting_enabled: false
