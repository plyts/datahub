# Prometheus — Data Hub metrics collection.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: datahub

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Dagster runs / assets / checks / daemons (datahub-ui image, exporter mode)
  - job_name: dagster
    static_configs:
      - targets: ["datahub-exporter:9188"]

  # Host CPU / RAM / disk of the SLES VM
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container resources
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: keycloak
    metrics_path: /auth/metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: oauth2-proxy
    static_configs:
      - targets: ["oauth2-proxy:44180"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
