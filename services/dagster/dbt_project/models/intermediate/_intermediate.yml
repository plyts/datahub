version: 2

models:
  - name: int_order_payments
    description: "Paiements agrégés par commande (nombre, montant total, ventilation carte / bon d'achat)."
    columns:
      - name: order_id
        description: "Commande."
        data_tests: [unique, not_null]
      - name: paid_amount
        description: "Somme des paiements de la commande."
        data_tests: [not_negative]

unit_tests:
  - name: test_int_order_payments_aggregates_by_order
    description: "Vérifie l'agrégation des paiements et la ventilation par moyen de paiement."
    model: int_order_payments
    given:
      - input: ref('stg_payments')
        rows:
          - {payment_id: "p1", order_id: "o1", payment_method: "card", amount: 10.00, paid_at: "2026-01-01 10:00:00"}
          - {payment_id: "p2", order_id: "o1", payment_method: "voucher", amount: 5.00, paid_at: "2026-01-01 11:00:00"}
          - {payment_id: "p3", order_id: "o2", payment_method: "paypal", amount: 7.50, paid_at: "2026-01-02 09:00:00"}
    expect:
      rows:
        - {order_id: "o1", payment_count: 2, paid_amount: 15.00, card_amount: 10.00, voucher_amount: 5.00, last_paid_at: "2026-01-01 11:00:00"}
        - {order_id: "o2", payment_count: 1, paid_amount: 7.50, card_amount: 0, voucher_amount: 0, last_paid_at: "2026-01-02 09:00:00"}
