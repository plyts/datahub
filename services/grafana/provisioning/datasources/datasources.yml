apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000

  # Active alerts and silences of the Prometheus rules (Grafana > Alerting).
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  # Read-only access to the Data Hub application database (audit trail, incidents).
  - name: Data Hub (PostgreSQL)
    uid: datahub-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: datahub_ro
    jsonData:
      database: datahub
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $DATAHUB_RO_PASSWORD
