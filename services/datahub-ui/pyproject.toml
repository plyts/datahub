[project]
name = "datahub-ui"
version = "1.0.0"
description = "Data Hub — Streamlit interface (11 modules) + Dagster Prometheus exporter"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datahub_ui*"]

[tool.setuptools.package-data]
datahub_ui = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs live services (Dagster webserver, PostgreSQL, Keycloak...) — see tests/integration",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "RUF012"]
"datahub_ui/testing/*" = ["S", "RUF012"]
