name: image-check
on:
  push:
    branches: [ci/image-check]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check image tags
        run: |
          for img in \
            prom/node-exporter:v1.13.0 prom/node-exporter:v1.12.0 prom/node-exporter:v1.11.1 prom/node-exporter:v1.10.2 \
            quay.io/prometheus/node-exporter:v1.13.0 quay.io/prometheus/node-exporter:v1.12.0 \
            gcr.io/cadvisor/cadvisor:v0.61.1 gcr.io/cadvisor/cadvisor:v0.61.0 gcr.io/cadvisor/cadvisor:v0.55.1 gcr.io/cadvisor/cadvisor:v0.52.1 \
            ghcr.io/google/cadvisor:v0.61.1 ghcr.io/google/cadvisor:0.61.1 \
            quay.io/prometheuscommunity/postgres-exporter:v0.21.1 quay.io/prometheuscommunity/postgres-exporter:v0.21.0 prometheuscommunity/postgres-exporter:v0.21.1 \
            quay.io/oauth2-proxy/oauth2-proxy:v7.15.6 quay.io/oauth2-proxy/oauth2-proxy:v7.15.0 quay.io/oauth2-proxy/oauth2-proxy:v7.12.0 \
            quay.io/keycloak/keycloak:26.8.2 quay.io/keycloak/keycloak:26.8 quay.io/keycloak/keycloak:26.4.0 \
            grafana/grafana:13.3.1 grafana/grafana:13.2.6 grafana/grafana:12.3.0 \
            postgres:17-bookworm postgres:17 python:3.12-slim-bookworm \
            caddy:2.11.9 grafana/loki:3.7.10 grafana/alloy:v1.22.0 prom/prometheus:v3.16.0 \
            gitea/gitea:1.27.3 woodpeckerci/woodpecker-server:v3.20.1 woodpeckerci/woodpecker-agent:v3.20.1 \
            ; do
            if docker manifest inspect "$img" > /dev/null 2>&1; then echo "IMAGE_OK $img"; else echo "IMAGE_MISSING $img"; fi
          done
